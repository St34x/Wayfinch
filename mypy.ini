# mypy --strict gate (T1.99, ENGINEERING.md section 5), run by mk/typecheck-py.mk.
# Scope: the plugin package and every Python file under tools/ (tests included).

# tools/quality/check_mypy_config.py allows only the sections and keys below (see its docstring); any other key,
# section or inline suppression in the checked files fails the gate.

[mypy]
strict = True
warn_unused_ignores = True
# A suppression names its error code: a bare type-ignore comment is an error.
enable_error_code = ignore-without-code
# Python floor (ENGINEERING.md section 8): stdlib APIs and syntax newer than Hermes' oldest Python (3.11) fail,
# except in modules under a ratchet block below (ignore_errors = True) until their task removes the block.
python_version = 3.11
files = hermes-plugin/glasses, tools
cache_dir = .local/mypy-cache
# Our tools/ directory is not a package, while Hermes ships a `tools` package. Without this, mypy maps
# `from tools import x` onto our directory instead of treating the Hermes import as missing.
namespace_packages = False

# Hermes packages: typed as Any at the adapter boundary only (not importable in the dev venv).
[mypy-gateway.*,hermes_cli.*,tools.*,agent.*,hermes_constants]
ignore_missing_imports = True

# The adapter subclasses the Hermes BasePlatformAdapter, which is Any here.
[mypy-glasses.adapter]
disallow_subclassing_any = False

# Ratchet baseline (ENGINEERING.md §10): one block per follow-up id - a "# T<id>" header line, its sections, a blank
# line. A baseline section holds only `ignore_errors = True`; the task that types the module deletes its own block.
# New modules never get a section: check_mypy_config.py allows only a subset of its RATCHET, and
# tools/quality/tests/test_mypy_baseline.py checks that every section still hides errors of its module and of no other.

# T1.55
[mypy-glasses_min]
ignore_errors = True
[mypy-glasses_min.adapter]
ignore_errors = True
