# SPDX-License-Identifier: Apache-2.0
# Version catalog of the Android app (T1.17a, T1.17b). Direct dependencies only; ledger rows: docs/dependencies.md.
# T1.17b declares every library of the planned link and app tasks; those tasks do not edit this file.
[versions]
agp = "9.4.1"
# The Kotlin version of the Android Gradle plugin 9.4.1 (built-in Kotlin: its POM depends on
# org.jetbrains.kotlin:kotlin-gradle-plugin 2.2.10). The pure modules use this same version; recorded only here.
kotlin = "2.2.10"
junit = "5.13.4"
kotlinx-serialization = "1.9.0"
androidx-core = "1.16.0"
androidx-activity = "1.10.1"
compose-bom = "2025.05.00"
navigation = "2.9.0"
coroutines = "1.10.2"
okhttp = "4.12.0"
androidx-test-runner = "1.6.2"
androidx-test-junit = "1.2.1"
# Static analysis (T1.107): self-contained jars with their own Kotlin compiler, run by JavaExec tasks of the root build.
detekt = "1.23.8"
ktlint = "1.8.0"

[libraries]
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
# Both are resolved with the "all" classifier (the self-contained jar), see build.gradle.kts.
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
